name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Login to ACR
      - uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Build and push image
      - run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/exam-reminder:${{ github.sha }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/exam-reminder:${{ github.sha }}

      # Deploy via REST API (NO AZ LOGIN NEEDED)
      - name: Deploy container via REST API
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/exam-reminder:${{ github.sha }}
          curl -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            https://management.azure.com/subscriptions/${{ secrets.AZURE_SUB_ID }}/resourceGroups/exam-reminder-rg/providers/Microsoft.App/containerApps/exam-reminder-app?api-version=2024-02-02-preview \
            -d "{
                  \"properties\": {
                    \"template\": {
                      \"containers\": [
                        {
                          \"name\": \"exam-reminder-app\",
                          \"image\": \"$IMAGE_TAG\"
                        }
                      ]
                    }
                  }
                }"
