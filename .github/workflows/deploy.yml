
name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your code
      - uses: actions/checkout@v5

      # Step 2: Test Docker login
      - name: Test Docker login
        run: |
          echo "Testing Docker login to ACR..."
          docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}

      # Step 3: Login to ACR via GitHub Action
      - uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Step 4: Build Docker image
      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/exam-reminder:${{ github.sha }}
          echo "Building Docker image: $IMAGE_TAG"
          docker build -t $IMAGE_TAG .

      # Step 5: Push Docker image to ACR
      - name: Push Docker image
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/exam-reminder:${{ github.sha }}
          echo "Pushing Docker image: $IMAGE_TAG"
          docker push $IMAGE_TAG

      # Step 6: Deploy container via REST API
      - name: Deploy container
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/exam-reminder:${{ github.sha }}
          echo "Deploying container with image: $IMAGE_TAG"
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.AZURE_CONTAINERAPP_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://management.azure.com/subscriptions/${{ secrets.AZURE_SUB_ID }}/resourceGroups/exam-reminder-rg/providers/Microsoft.App/containerApps/exam-reminder-app?api-version=2024-02-02-preview \
            -d "{
                  \"properties\": {
                    \"template\": {
                      \"containers\": [
                        {
                          \"name\": \"exam-reminder-app\",
                          \"image\": \"$IMAGE_TAG\"
                        }
                      ]
                    }
                  }
                }"